<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스냅주 코인 시안</title>
<style>body{margin:0;padding:20px 16px 40px;background:#2a2a26;color:#fff6e6;font-family:system-ui,sans-serif}h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:#cfc2b0;font-size:14px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-width:1000px}.c{background:#3a3832;border-radius:16px;padding:16px;text-align:center}.c h2{font-size:17px;margin:10px 0 2px}.c small{color:#cfc2b0;font-size:13px}.big{width:120px;height:120px}.row{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 12px;border-radius:99px;background:rgba(18,14,12,.55);font-size:18px}.row svg{width:22px;height:22px}</style></head><body><h1>🪙 스냅주 코인 시안 5가지</h1><p>큰 그림 아래가 게임 왼쪽 위에서 실제로 보이는 크기예요. 번호로 골라 주세요.</p><div class="g" id="g"></div>
<script>
const rim=(a,b)=>`<defs><radialGradient id="r${a}" cx="35%" cy="30%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient></defs>`;
const S=[
['1. 클래식 금화','가장 동전다운 모양, 가운데 별',`<defs><radialGradient id="a" cx="35%" cy="30%"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#d89a1e"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="#b87a12"/><circle cx="50" cy="50" r="41" fill="url(#a)"/><circle cx="50" cy="50" r="32" fill="none" stroke="#b87a12" stroke-width="3"/><path d="M50 28l6.6 13.6 15 2.1-10.9 10.5 2.6 14.9L50 62l-13.3 7.1 2.6-14.9L28.4 43.700l15-2.100z" fill="#b87a12"/>`],
['2. 발자국 금화','동물 섬답게 발바닥 무늬',`<defs><radialGradient id="b" cx="35%" cy="30%"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#e0a020"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="#c0841a"/><circle cx="50" cy="50" r="40" fill="url(#b)"/><g fill="#a86a10"><ellipse cx="50" cy="60" rx="15" ry="12"/><circle cx="31" cy="46" r="6.500"/><circle cx="43" cy="35" r="7"/><circle cx="57" cy="35" r="7"/><circle cx="69" cy="46" r="6.500"/></g>`],
['3. 사진기 금화','사진 게임이라는 게 바로 보여요',`<defs><radialGradient id="c" cx="35%" cy="30%"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#d8981c"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="#b87a12"/><circle cx="50" cy="50" r="40" fill="url(#c)"/><path d="M28 38h11l4-7h14l4 7h11a3 3 0 0 1 3 3v26a3 3 0 0 1-3 3H28a3 3 0 0 1-3-3V41a3 3 0 0 1 3-3z" fill="#a86a10"/><circle cx="50" cy="53" r="11" fill="#ffe98a"/><circle cx="50" cy="53" r="6" fill="#a86a10"/>`],
['4. 납작 만화 코인','외곽선 진하고 귀여운 그림체',`<circle cx="50" cy="50" r="44" fill="#ffc92e" stroke="#5a3a10" stroke-width="6"/><circle cx="50" cy="50" r="30" fill="none" stroke="#e09a10" stroke-width="5"/><path d="M32 30a26 26 0 0 1 16-8" fill="none" stroke="#fff6c8" stroke-width="6" stroke-linecap="round"/><rect x="45" y="34" width="10" height="32" rx="5" fill="#e09a10"/>`],
['5. 반짝 금화','윤이 나는 3D 느낌 + 반짝임',`<defs><linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".5" stop-color="#f2bc2e"/><stop offset="1" stop-color="#b87a12"/></linearGradient></defs><ellipse cx="50" cy="54" rx="44" ry="42" fill="#8a5a10"/><ellipse cx="50" cy="48" rx="44" ry="42" fill="url(#e)"/><ellipse cx="50" cy="48" rx="31" ry="29" fill="none" stroke="#fff4b0" stroke-width="3" opacity=".8"/><path d="M78 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>`],
];
document.getElementById('g').innerHTML=S.map(([t,d,svg])=>`<div class="c"><svg class="big" viewBox="0 0 100 100">${svg}</svg><h2>${t}</h2><small>${d}</small><br><span class="row"><svg viewBox="0 0 100 100">${svg}</svg> 1,250</span></div>`).join('');
</script></body></html>
