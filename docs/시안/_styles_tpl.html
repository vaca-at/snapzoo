<script type="module">
import * as THREE from 'three';

const pathX = (z) => 2.6 * sin(z * 0.055) + 1.2 * sin(z * 0.017);

// 셀 애니메이션: 뒤집은 껍질로 잉크 선

const POST = {
  cel: `vec3 fx(vec2 uv){ vec3 c=tex(uv); return c; }`,
  film: `vec3 fx(vec2 uv){
      float d=depthAt(uv); float blur=clamp(abs(d-uFocus)*1.2,0.0,1.0)*uDof;
      vec3 c=vec3(0.0); float tot=0.0;
      for(int i=0;i<12;i++){ float a=float(i)*2.39996; float r=sqrt(float(i)/12.0); vec2 o=vec2(cos(a),sin(a))*r*blur*0.007*vec2(uRes.y/uRes.x,1.0); c+=tex(uv+o); tot+=1.0; }
      c/=tot;
      vec3 glow=vec3(0.0); for(int i=0;i<8;i++){ float a=float(i)*0.785; glow+=max(tex(uv+vec2(cos(a),sin(a))*0.02)-0.7,0.0); } c+=glow*0.18;   // 빛 번짐
      c=pow(c,vec3(0.95)); c*=vec3(1.04,1.0,0.94);                       // 따뜻한 색보정
      c*=1.0-0.35*pow(length(uv-0.5)*1.25,2.2);                        // 가장자리 어둡게
      c+=(hash(uv*uRes+uTime)-0.5)*0.025; return c; }`,
  water: `vec3 fx(vec2 uv){
      vec2 w=vec2(noise(uv*9.0+3.0),noise(uv*9.0+7.0))*0.006; vec3 c=tex(uv+w);
      float px=1.5/uRes.x, py=1.5/uRes.y;
      float l=dot(c,vec3(0.333)); float gx=dot(tex(uv+w+vec2(px,0)),vec3(0.333))-dot(tex(uv+w-vec2(px,0)),vec3(0.333)); float gy=dot(tex(uv+w+vec2(0,py)),vec3(0.333))-dot(tex(uv+w-vec2(0,py)),vec3(0.333));
      float e=length(vec2(gx,gy)); c=mix(c,c*0.72,smoothstep(0.03,0.16,e));          // 물감 가장자리가 진하게
      c=floor(c*7.0+noise(uv*30.0)*0.6)/7.0*0.35+c*0.65;                         // 물감이 고인 얼룩
      float paper=noise(uv*uRes*0.35)*0.5+noise(uv*uRes*0.08)*0.5; c*=0.94+0.06*paper;   // 종이결
      c=mix(c,vec3(0.99,0.97,0.92),0.14); return c; }`,
  clay: `vec3 fx(vec2 uv){
      float b=smoothstep(0.42,0.0,uv.y)+smoothstep(0.62,1.0,uv.y);                    // 미니어처 초점 (위 · 아래 흐리게)
      vec3 c=vec3(0.0); for(int i=0;i<12;i++){ float a=float(i)*2.39996; float r=sqrt(float(i)/12.0); c+=tex(uv+vec2(cos(a),sin(a))*r*b*0.01*vec2(uRes.y/uRes.x,1.0)); } c/=12.0;
      c=mix(vec3(dot(c,vec3(0.3,0.59,0.11))),c,1.18); c*=1.0-0.25*pow(length(uv-0.5)*1.3,2.0); c+=(hash(uv*uRes+floor(uTime*12.0))-0.5)*0.03; return c; }`,
  paper: `vec3 fx(vec2 uv){ vec3 c=tex(uv); float f=noise(uv*uRes*0.5)*0.5+noise(uv*uRes*0.05)*0.5; c*=0.95+0.05*f; c*=1.0-0.18*pow(length(uv-0.5)*1.3,2.0); return c; }`,
};

function postScene(style) {
  const mat = new THREE.ShaderMaterial({ depthTest: false, depthWrite: false,
    uniforms: { tDiffuse: { value: null }, tDepth: { value: null }, uRes: { value: new THREE.Vector2() }, uTime: { value: 0 }, uNear: { value: 0.1 }, uFar: { value: 900 }, uFocus: { value: 0.3 }, uDof: { value: 1 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: NOISE + `
      #include <packing>
      uniform sampler2D tDiffuse, tDepth; uniform vec2 uRes; uniform float uTime,uNear,uFar,uFocus,uDof; varying vec2 vUv;
      vec3 tex(vec2 uv){ return texture2D(tDiffuse, uv).rgb; }
      float depthAt(vec2 uv){ float d=texture2D(tDepth,uv).x; float vz=perspectiveDepthToViewZ(d,uNear,uFar); return clamp(-vz/60.0,0.0,1.0); }
      ` + POST[style] + `
      void main(){ gl_FragColor=vec4(fx(vUv),1.0); }` });

}
