* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }

.eyebrow { margin: 0; font-family: var(--hand); color: var(--moss); font-size: 18px; }
h1 { margin: 2px 0 8px; font-family: var(--hand); font-weight: 400; font-size: clamp(34px, 6.4vw, 54px); line-height: 1.05; }
h2 { margin: 8px 0 0; font-family: var(--hand); font-weight: 400; font-size: 32px; }
.lead { margin: 0; color: var(--soft); max-width: 72ch; }
.scene { border-radius: 20px; overflow: hidden; border: 1.5px solid var(--line); }
.scene svg { display: block; width: 100%; height: auto; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.card svg { width: 100%; height: auto; display: block; border-radius: 14px; aspect-ratio: 300 / 360; }
.card b { font-family: var(--hand); font-weight: 400; font-size: 24px; padding: 0 4px; line-height: 1.1; }
.card p { margin: 0; padding: 0 4px 4px; color: var(--soft); font-size: 13.5px; line-height: 1.5; }

svg g { transform-box: view-box; }
.breath { animation: breath 3.2s ease-in-out infinite; }
.flap, .ear { animation: flap 1.9s ease-in-out infinite; }
.flick { animation: flick 3.6s ease-in-out infinite; }
.wag { animation: wag 1.2s ease-in-out infinite; }
.swish { animation: swish 2.2s ease-in-out infinite; }
.blink { animation: blink 4.4s infinite; }
.hair { animation: swayS 3.4s ease-in-out infinite; }
.ribbon { animation: sway 1.3s ease-in-out infinite; }
.skirt { animation: skirt 2.8s ease-in-out infinite; }
.arm { animation: swayS 4s ease-in-out infinite; }
.head, .tilt { animation: tilt 5.5s ease-in-out infinite; }
.graze { animation: graze 7s ease-in-out infinite; }
.chew { animation: chew 0.5s ease-in-out infinite; }
.tree { animation: swayS 6s ease-in-out infinite; }
.cloud { animation: drift 40s linear infinite alternate; }
.grassw { animation: swayS 2.6s ease-in-out infinite; }
@keyframes breath { 50% { transform: translateY(-1.6px); } }
@keyframes tilt { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
@keyframes flap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.84); } }
@keyframes flick { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-14deg); } 88% { transform: rotate(4deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes swayS { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
@keyframes wag { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
@keyframes swish { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
@keyframes skirt { 0%, 100% { transform: skewX(-2.4deg); } 50% { transform: skewX(2.4deg); } }
@keyframes graze { 0%, 30%, 100% { transform: rotate(0); } 42%, 82% { transform: rotate(38deg); } }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
@media (prefers-reduced-motion: reduce) { svg g { animation: none !important; } }

}
