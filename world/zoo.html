<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스냅주 · 섬 식구들</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<style>
@font-face { font-family: 'OngleipUnz'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2'); font-display: swap; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e8d4b4; font-family: 'OngleipUnz', sans-serif; color: #3a2e24; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
h1 { position: fixed; left: 18px; top: 10px; margin: 0; font-weight: 400; font-size: 34px; z-index: 2; pointer-events: none; }
.tag { position: fixed; transform: translate(-50%, 0); font-size: 20px; z-index: 2; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<h1>섬 식구들 · 끌어서 둘러보기</h1>
<canvas id="gl"></canvas>
<script type="module">
// 섬의 동물 · 산책자를 한자리에 (zoo3d.js 확인 · 나중에 도감으로)
import { THREE, SPECIES, walker, LOOK } from './zoo3d.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const LK = LOOK.soft, cv = document.getElementById('gl');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = LK.exp; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#e8d4b4'); sc.fog = new THREE.Fog('#e8d4b4', 30, 70);
sc.add(new THREE.HemisphereLight(LK.hemi[0], LK.hemi[1], LK.hemi[2] * 1.3));
const d = new THREE.DirectionalLight(LK.sunC, LK.sunI * 0.9); d.position.set(-6, 10, 8); d.castShadow = true; d.shadow.mapSize.set(2048, 2048); Object.assign(d.shadow.camera, { left: -16, right: 16, top: 10, bottom: -10, near: 1, far: 50 }); d.shadow.bias = -0.0005; sc.add(d);
const rim = new THREE.DirectionalLight('#ffd8a0', 1.4); rim.position.set(4, 3, -8); sc.add(rim);
const fl = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: '#c8b07a', roughness: 1 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; sc.add(fl);
const LIST = [['산책자', 'walker'], ['사막여우', 'fennec'], ['펭귄', 'penguin'], ['톰슨가젤', 'gazelle'], ['맥', 'tapir'], ['고릴라', 'gorilla'], ['아기 코끼리', 'elephant'], ['얼룩말', 'zebra'], ['누', 'gnu'], ['북극곰', 'polarbear'], ['낙타', 'camel'], ['아기 기린', 'giraffe'], ['돌고래', 'dolphin']];
let x = -11; const items = LIST.map(([name, k]) => { const a = k === 'walker' ? walker() : SPECIES[k](); sc.add(a.root); const b = new THREE.Box3().setFromObject(a.root), w = Math.max(b.getSize(new THREE.Vector3()).x, b.getSize(new THREE.Vector3()).z * 0.6, 0.6); x += w / 2 + 0.35; a.root.position.set(x, k === 'dolphin' ? 0.35 : 0, 0); a.root.rotation.y = 0.8; x += w / 2 + 0.35; const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = name; document.body.append(tag); return { a, tag }; });
const off = -(x - 11) / 2; items.forEach(({ a }) => (a.root.position.x += off));
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200); cam.position.set(0, 3.2, 26);
const ctl = new OrbitControls(cam, cv); ctl.target.set(0, 0.9, 0); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.48;
const p = new THREE.Vector3(), clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ctl.update();
  items.forEach(({ a, tag }) => { a.update(t, dt); p.copy(a.root.position); p.y -= 0.05; p.project(cam); tag.style.left = (p.x * 0.5 + 0.5) * innerWidth + 'px'; tag.style.top = (-p.y * 0.5 + 0.5) * innerHeight + 8 + 'px'; });
  r.render(sc, cam); requestAnimationFrame(frame);
}
frame();
window.__ok = true;
</script>
</body>
</html>
