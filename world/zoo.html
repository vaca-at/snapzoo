<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스냅주 · 섬 식구들</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<style>
@font-face { font-family: 'OngleipUnz'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2'); font-display: swap; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e8d4b4; font-family: 'OngleipUnz', sans-serif; color: #3a2e24; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
h1 { position: fixed; left: 18px; top: 10px; margin: 0; font-weight: 400; font-size: 34px; z-index: 2; pointer-events: none; }
.tag { position: fixed; transform: translate(-50%, 0); font-size: 13px; z-index: 2; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<h1>섬 식구들 · 끌어서 둘러보기</h1>
<canvas id="gl"></canvas>
<script type="module">
// 섬 식구 60종을 구역별 여섯 줄로 (zoo3d.js + fauna.js 확인용 · 나중에 도감으로)
import { THREE, SPECIES, walker, LOOK } from './zoo3d.js';
import { ROSTER } from './fauna.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const LK = LOOK.soft, cv = document.getElementById('gl');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = LK.exp; r.shadowMap.enabled = true;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#e8d4b4');
sc.add(new THREE.HemisphereLight(LK.hemi[0], LK.hemi[1], LK.hemi[2] * 1.4));
const d = new THREE.DirectionalLight(LK.sunC, LK.sunI * 0.9); d.position.set(-6, 14, 10); d.castShadow = true; d.shadow.mapSize.set(2048, 2048); Object.assign(d.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60 }); sc.add(d);
const fl = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#c8b07a', roughness: 1 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; sc.add(fl);
const ZONES = ['village', 'savanna', 'jungle', 'desert', 'arctic', 'sea'], items = [];
ZONES.forEach((zn, row) => {
  let x = 0; const list = ROSTER.filter((q) => q[0] === zn);
  list.forEach(([, id, name, , , scale]) => {
    if (id === 'whale') return; const a = SPECIES[id](); a.root.scale.setScalar(scale); sc.add(a.root);
    const b = new THREE.Box3().setFromObject(a.root), sz = b.getSize(new THREE.Vector3()), w = Math.max(sz.x, sz.z * 0.5, 0.5);
    x += w / 2 + 0.3; a.root.position.set(x, 0, -row * 2.6); a.root.rotation.y = 0.7; x += w / 2 + 0.3;
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = name; document.body.append(tag); items.push({ a, tag });
  });
  items.filter((it) => it.a.root.position.z === -row * 2.6).forEach((it) => (it.a.root.position.x -= x / 2));
});
const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 200); cam.position.set(0, 9, 14);
const ctl = new OrbitControls(cam, cv); ctl.target.set(0, 0.4, -6.5); ctl.enableDamping = true;
const p = new THREE.Vector3(), clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ctl.update();
  items.forEach(({ a, tag }) => { a.update(t, dt); p.copy(a.root.position); p.project(cam); tag.style.left = (p.x * 0.5 + 0.5) * innerWidth + 'px'; tag.style.top = (-p.y * 0.5 + 0.5) * innerHeight + 4 + 'px'; });
  r.render(sc, cam); requestAnimationFrame(frame);
}
frame(); window.__ok = items.length;
</script>
</body>
</html>
