<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스냅주 · 사람 체형</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<style>
@font-face { font-family: 'OngleipUnz'; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2406-1@1.0/Ownglyph_UNZ-Rg.woff2') format('woff2'); font-display: swap; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #e8d4b4; font-family: 'OngleipUnz', sans-serif; color: #3a2e24; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
h1 { position: fixed; left: 18px; top: 10px; margin: 0; font-weight: 400; font-size: 34px; z-index: 2; pointer-events: none; }
.tag { position: fixed; transform: translate(-50%, 0); font-size: 13px; z-index: 2; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<h1>사람 체형 1 · 2 · 3 · 끌어서 둘러보기</h1>
<canvas id="gl"></canvas>
<script type="module">
// 사람 체형 셋 × 여 · 남 (person.js 확인용)
import { THREE, LOOK } from './zoo3d.js';
import { person, BODIES } from './person.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const LK = LOOK.soft, cv = document.getElementById('gl');
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = LK.exp; r.shadowMap.enabled = true;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#e8c8a0');
sc.add(new THREE.HemisphereLight('#ffe8d0', '#5a4a30', 1.3));
const d = new THREE.DirectionalLight('#ffe2b8', 2.4); d.position.set(-2, 4, 4); d.castShadow = true; d.shadow.mapSize.set(2048, 2048); Object.assign(d.shadow.camera, { left: -4, right: 4, top: 3, bottom: -1, near: 0.5, far: 20 }); sc.add(d);
const fl = new THREE.Mesh(new THREE.CircleGeometry(20, 48), new THREE.MeshStandardMaterial({ color: '#c8b07a', roughness: 1 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; sc.add(fl);
const items = []; let i = 0;
for (let b = 0; b < 3; b++) for (const g of ['f', 'm']) { const p = person(i % 8, { g, body: b, hat: b === 1 ? 3 : 0 }); p.root.position.set(-2.6 + i * 1.05, 0, 0); sc.add(p.root); const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = `${b + 1} · ${BODIES[b].name}`; document.body.append(tag); items.push({ a: p, tag }); i++; }
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0, 1.3, 7.2);
const ctl = new OrbitControls(cam, cv); ctl.target.set(0, 0.85, 0); ctl.enableDamping = true;
const pv = new THREE.Vector3(), clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ctl.update();
  items.forEach(({ a, tag }, k) => { a.walk = 0; if (k % 2 && Math.floor(t / 3) % 2) a.waveT = Math.max(a.waveT, 0.1); a.update(t + k, dt); pv.copy(a.root.position); pv.project(cam); tag.style.left = (pv.x * 0.5 + 0.5) * innerWidth + 'px'; tag.style.top = (-pv.y * 0.5 + 0.5) * innerHeight + 6 + 'px'; });
  r.render(sc, cam); requestAnimationFrame(frame);
}
frame(); window.__ok = items.length;
</script>
</body>
</html>
